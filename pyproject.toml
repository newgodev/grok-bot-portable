[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-portable"
version = "0.1.0"
description = "Portable Memory v2 / files=SSOT + INF demo (grokbot_portable)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "grok-bot-portable" }]

[project.scripts]
grokbot-portable = "grokbot_portable.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
